[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revelai"
version = "0.1.0"
description = "Split album page scans into individual photos, then restore them with AI"
readme = "README.md"
# An SPDX expression rather than a file reference. In this monorepo the LICENSE
# lives at the repository root, which a build backend cannot reach from inside
# a package, and duplicating it here would leave two copies to drift apart. The
# sdist force-includes the real file (see below); the wheel carries the licence
# in its metadata as License-Expression.
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Maiko Trindade" }]
keywords = [
    "photo-restoration",
    "opencv",
    "photo-scanning",
    "image-processing",
    "genealogy",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Crop verification, orientation and descriptions. Nothing in RevelAI requires
# this: without it, --verify reports that it is unavailable and the run goes on.
vlm = ["anthropic>=0.49"]
# Restoration models that run on the user's own machine. The classical colour,
# denoise and dust operations need none of this.
local-models = ["onnxruntime>=1.17"]
all = ["anthropic>=0.49", "onnxruntime>=1.17"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/maikotrindade/revelAI"
Repository = "https://github.com/maikotrindade/revelAI"
Issues = "https://github.com/maikotrindade/revelAI/issues"

[project.scripts]
revelai = "revelai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revelai"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
