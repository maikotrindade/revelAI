[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revelai"
version = "0.1.0"
description = "Split album page scans into individual photos, then restore them with AI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Maiko Trindade" }]
keywords = [
    "photo-restoration",
    "opencv",
    "photo-scanning",
    "image-processing",
    "genealogy",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/maikotrindade/revelAI"
Repository = "https://github.com/maikotrindade/revelAI"
Issues = "https://github.com/maikotrindade/revelAI/issues"

[project.scripts]
revelai = "revelai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revelai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
