name: mcp-server

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp-server/**"
      - "packages/engine/**"
      - ".github/workflows/mcp-server-ci.yml"
  pull_request:
    paths:
      - "packages/mcp-server/**"
      - "packages/engine/**"
      - ".github/workflows/mcp-server-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/mcp-server

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .

  test:
    name: test ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # opencv-python links against libGL; the GitHub Linux runners do not ship it.
      - name: Install OpenCV system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install --upgrade pip
      # The engine from this checkout, not a published wheel: the two move together.
      - run: pip install -e ../engine
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
