name: engine release

# Publishes the engine when a v* tag is pushed.
#
# GitHub Packages has no Python registry: it hosts npm, RubyGems, Maven, NuGet
# and containers, but not PyPI. So "distributed by GitHub Packages" means the
# container registry, ghcr.io, which is part of GitHub Packages. The wheel and
# sdist are attached to the GitHub Release in the same run, so anyone who would
# rather pip install still can.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheel:
    name: build wheel and attach to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build
        working-directory: packages/engine
        run: python -m build --outdir dist
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/engine/dist/*
          generate_release_notes: true

  container:
    name: publish container to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase: the repository is revelAI, but an image name cannot be.
          images: ghcr.io/${{ github.repository_owner }}/revelai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: packages/engine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
