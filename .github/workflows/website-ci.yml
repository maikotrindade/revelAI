name: website

on:
  push:
    branches: [main]
    paths:
      - "packages/website/**"
      - "packages/engine/docs/img/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "packages/website/**"
      - "packages/engine/docs/img/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @revelai/website typecheck
      - name: Lint
        run: pnpm --filter @revelai/website lint
      # The build also syncs the figures out of packages/engine, so a missing
      # or unreadable figure fails here rather than shipping a broken page.
      - name: Build (static export)
        run: pnpm --filter @revelai/website build
      - name: Check the export is really static
        run: |
          test -f packages/website/out/index.html
          test -f packages/website/out/honest-limitations/index.html
          test -f packages/website/out/run/index.html
          echo "static export contains $(find packages/website/out -name '*.html' | wc -l) pages"
      # The run page drives a server on the visitor's own machine and must not
      # learn to talk to anything else. Anything but loopback and the two links
      # the page deliberately makes is a regression in the product's central
      # promise, so it fails the build rather than being noticed later.
      - name: The run page must contact loopback and nothing else
        run: |
          # www.w3.org is the SVG namespace, which is an identifier rather than
          # a request; github.com and maikotrindade.com are links the page makes
          # on purpose. Anything else is a host this page learned to talk to.
          hosts=$(grep -oE 'https?://[a-zA-Z0-9.:_-]+' packages/website/out/run/index.html \
            | sort -u \
            | grep -vE '^https?://(127\.0\.0\.1|localhost)(:[0-9]+)?$' \
            | grep -vE '^https?://www\.w3\.org$' \
            | grep -vE '^https://(github\.com|maikotrindade\.com)$' || true)
          if [ -n "$hosts" ]; then
            echo "Unexpected hosts in the run page:"; echo "$hosts"; exit 1
          fi
          grep -q '127.0.0.1' packages/website/out/_next/static/chunks/app/run/*.js
          echo "run page contacts loopback only"
